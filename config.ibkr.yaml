# Config for a machine running an IBKR Client Portal Gateway.
#
# WHY THIS IS A SEPARATE FILE
# IBKR has no API key. It talks to a gateway that must be running and
# interactively logged in, with a session that expires roughly daily. A GitHub
# Actions runner has nothing to log into, so `option_volume` can never work
# there — enabling it in the committed config.yaml would just make the cron
# fail every five minutes. Keep config.yaml for Actions; use this one here.
#
#   monitor verify   -c config.ibkr.yaml     # check the gateway is reachable
#   monitor run      -c config.ibkr.yaml     # one poll
#   monitor console  -c config.ibkr.yaml     # the bot's commands
#
# Point the cron on THIS machine at this file. See SETUP.md step 10.

tickers:
  - NVDA
  - AAPL
  - TSLA
  - MSFT

detectors:
  # The unusual-activity signal you get from IBKR: the whole option chain
  # against its own average, pace-adjusted for how much of the session has run.
  # No strike, no premium, no direction — but it is a real signal, and free with
  # an IBKR account.
  option_volume:
    enabled: true
    min_ratio: 2.5            # 2.5x its normal chain volume
    min_contracts: 5000       # ignore thin chains where the ratio is noise
    min_session_pct: 20.0     # a day-cumulative figure needs a base first
    cooldown_minutes: 240     # one per ticker per session is the useful rate

  volume_anomaly:
    enabled: true
    bar_interval: 5min

  insider_trades:
    enabled: true

  # Still need Unusual Whales; nothing in IBKR's REST surface carries
  # individual off-exchange prints or flow alerts.
  dark_pool:
    enabled: false
  block_trades:
    enabled: false
  options_flow:
    enabled: false

run:
  extended_hours: false
  min_severity: low
  attach_canslim: true
  canslim_min_severity: medium

providers:
  # IBKR serves bars here too: 30-second granularity, a genuine 90-day dollar
  # ADV, and no FMP plan tier to worry about. Switch `bars` back to fmp if you
  # would rather keep the gateway load down.
  bars: ibkr
  option_volume: ibkr
  insider: sec_edgar
  trades: unusual_whales     # unused while dark_pool/block_trades are off
  flow: unusual_whales       # unused while options_flow is off

  ibkr:
    # The gateway's URL. The standard Client Portal Gateway listens here and
    # serves a self-signed certificate, which this provider expects.
    base_url: "https://localhost:5000"
    history_volume_multiplier: 100   # CP history quotes stock volume in lots
    fields: {}                        # `monitor verify` reports which ids answered

  sec:
    user_agent: "stock-movement-monitor you@example.com"   # SEC_USER_AGENT overrides
