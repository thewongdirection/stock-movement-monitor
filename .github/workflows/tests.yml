name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      # Optional: lets the CAN SLIM tests run instead of skipping.
      - name: Fetch the CAN SLIM grader skill
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/thewongdirection/can-slim-grader \
            vendor/can-slim-grader

      - name: Tests
        run: python -m pytest -q
        env:
          CANSLIM_SKILL_PATH: vendor/can-slim-grader

      # Catches a bad threshold or a stray key in the committed config before
      # the cron picks it up and quietly clamps it.
      - name: Config is valid
        run: python -m monitor validate
        env:
          PYTHONPATH: src
