name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      # Catches a bad threshold or a stray key in the committed config before
      # the cron picks it up and quietly clamps it.
      - name: Config is valid
        run: python -m monitor validate
        env:
          PYTHONPATH: src
