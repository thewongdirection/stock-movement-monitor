name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      # Catches a bad threshold or a stray key in the committed config before
      # anyone deploys it and the schema quietly clamps it.
      - name: Shipped configs are valid
        run: |
          python -m monitor --config config.example.yaml validate || true
          python -m monitor --config config.replay.yaml validate
        env:
          PYTHONPATH: src

      # The demo path in SETUP.md step 2 is the first thing anyone runs. If it
      # breaks, the project looks broken.
      - name: The no-credentials demo still works
        run: |
          python -m monitor --config config.replay.yaml run \
            --dry-run --as-of 2026-07-24T12:00:00
        env:
          PYTHONPATH: src
