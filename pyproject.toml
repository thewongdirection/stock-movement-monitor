[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-movement-monitor"
version = "2.0.0"
description = "Hourly alerts when someone actually takes a position in a stock you watch"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "PyYAML>=6.0,<7"]

# The LLM narrator for the CAN SLIM scorecard. Optional on purpose: without it
# every letter arithmetic can settle is still scored, and the two it cannot are
# reported as unmeasured rather than guessed.
[project.optional-dependencies]
narrator = ["anthropic>=0.120"]

[project.scripts]
monitor = "monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
