[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-movement-monitor"
version = "1.0.0"
description = "Alerts on unusually large trades, options flow and insider filings for a watchlist"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "PyYAML>=6.0,<7"]

# The LLM narrator for the CAN SLIM scorecard. Optional on purpose: without it
# the letters are still scored, just programmatically.
[project.optional-dependencies]
narrator = ["anthropic>=0.120"]

[project.scripts]
monitor = "monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
