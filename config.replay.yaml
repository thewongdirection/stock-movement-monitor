# Replay config — runs the real detectors against a captured file.
#
#   monitor capture -o state/snapshot.json
#   monitor run -c config.replay.yaml --as-of 2026-07-22T11:31:00-04:00
#
# `--as-of` sets the run clock, truncates the file there so the replay cannot see
# its own future, and forces --dry-run.
tickers:
  - NVDA
  - MSFT

detectors:
  volume_anomaly:
    enabled: true
    bar_interval: 30min        # must match the snapshot's interval
    baseline_sessions: 12
  dark_pool:
    enabled: true
  block_trades:
    enabled: true
  options_flow:
    enabled: true
  option_volume:
    enabled: true
  insider_trades:
    enabled: false

run:
  attach_canslim: false
  cold_start_lookback_minutes: 400   # wide open, so every bar is a candidate
  min_severity: low

providers:
  bars: snapshot
  trades: snapshot
  flow: snapshot
  option_volume: snapshot
  snapshot:
    path: state/snapshot.json
